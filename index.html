<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <title>EAJJY AI | AI & Automation for Professional Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

$html = Get-Content "index.html" -Raw -Encoding UTF8
$meta = '    <meta name="description" content="EAJJY AI builds AI and automation systems for professional services firms. Eliminate manual work, integrate your tools, and scale without hiring." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EAJJY AI" />
    <meta property="og:image" content="https://www.eajjy.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />'
$html = $html -replace '(<title>)', "$meta`n    `$1"
Set-Content "index.html" -Value $html -Encoding UTF8
Write-Host "index.html updated"
